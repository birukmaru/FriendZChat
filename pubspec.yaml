name: friendzchat
description: "FriendZChat — speak freely, connect privately."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ─── State Management ────────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ─── Routing ─────────────────────────────────────────────────────────────────
  go_router: ^14.2.7

  # ─── Networking ──────────────────────────────────────────────────────────────
  dio: ^5.7.0

  # ─── Models / Serialization ──────────────────────────────────────────────────
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.5

  # ─── Storage ─────────────────────────────────────────────────────────────────
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # ─── UI / UX ─────────────────────────────────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  animated_text_kit: ^4.2.2
  flutter_animate: ^4.5.0
  lottie: ^3.1.2

  # ─── Utilities ───────────────────────────────────────────────────────────────
  intl: ^0.20.2
  url_launcher: ^6.3.1
  package_info_plus: ^8.0.2
  share_plus: ^10.1.4
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.5
  logger: ^2.4.0
  uuid: ^4.5.1
  rxdart: ^0.28.0

  # ─── Notifications ───────────────────────────────────────────────────────────
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # ─── Dependency Injection ────────────────────────────────────────────────────
  get_it: ^7.7.0
  injectable: ^2.4.4

  # ─── Device / Sensors ────────────────────────────────────────────────────────
  device_info_plus: ^10.1.2
  flutter_native_splash: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # ─── Code generation ─────────────────────────────────────────────────────────
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  injectable_generator: ^2.6.2

  # ─── Testing ─────────────────────────────────────────────────────────────────
  mockito: ^5.4.4
  mocktail: ^1.0.4

  # ─── Coverage ────────────────────────────────────────────────────────────────
  coverage: ^1.8.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/images/illustrations/
    - assets/images/icons/
    - assets/data/

flutter_native_splash:
  color: "#0E7C7B"
  image: assets/images/splash_logo.png
  color_dark: "#0F172A"
  image_dark: assets/images/splash_logo.png